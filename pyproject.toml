[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-media-server"
version = "0.1.0"
description = "A lightweight media server with on-demand sprite generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
serve = "serve:main"

[tool.hatch.build.targets.wheel]
include = [
    "serve.py",
    "app.html",
]
